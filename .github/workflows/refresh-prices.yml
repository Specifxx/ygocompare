name: Refresh prices

# The daily import: TCGCSV + stores + budgeted eBay → data/ → commit to main.
# The data commit's SUBJECT carries [deploy], so it is the day's one
# production build (scripts/vercel-ignore-build.sh). Scheduled after TCGCSV's
# ~20:00 UTC refresh would be ideal for TCGplayer, but the eBay run hour is set
# per site so Lorcana Compare and Gundam Compare never overlap on the shared
# eBay app (SITE.ebay.runHourUtc) — keep this cron's hour equal to it.

#
# TWICE A DAY (owner, 2026-11-23 UX review, P0 2: pages said "checked 30 hours ago" against our "about twice a day"). GitHub
# starts scheduled runs 7 to 12 hours late, and one import a day left live prices a day and more old. The 00:17 run reads the
# stores and TCGplayer only (no eBay calls: the shared app's day stays on the 12:17 run). Both commits carry [deploy];
# scripts/vercel-ignore-build.sh still allows at most one production build per 12 hours (owner, 2026-11-02).
# freshness.yml starts this workflow (eBay off) and fails red when the data is over 12 hours old.

on:
  schedule:
    - cron: "17 12 * * *"
    - cron: "17 0 * * *"
  workflow_dispatch:
    inputs:
      ebay:
        description: "Spend eBay calls this run"
        type: boolean
        default: true

concurrency:
  group: refresh-prices
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Import
        env:
          EBAY_CLIENT_ID: ${{ secrets.EBAY_CLIENT_ID }}
          EBAY_CLIENT_SECRET: ${{ secrets.EBAY_CLIENT_SECRET }}
          EBAY_REFRESH: ${{ ((github.event_name == 'schedule' && github.event.schedule == '17 0 * * *') || (github.event_name == 'workflow_dispatch' && !inputs.ebay)) && 'false' || 'true' }}
        run: npx tsx scripts/import-all.ts
      # Amazon ASINs for the sealed pages' Amazon row (Creators API searchItems, matched by the store matcher; ASINs only,
      # prices are fetched by each Vercel build and never committed: DECISIONS.md 2026-11-05). A no-op until the secrets exist.
      - name: Amazon ASINs (Creators API)
        continue-on-error: true
        env:
          AMAZON_CREATORS_AU_CLIENT_ID: ${{ secrets.AMAZON_CREATORS_AU_CLIENT_ID }}
          AMAZON_CREATORS_AU_CLIENT_SECRET: ${{ secrets.AMAZON_CREATORS_AU_CLIENT_SECRET }}
          AMAZON_CREATORS_AU_VERSION: ${{ secrets.AMAZON_CREATORS_AU_VERSION }}
          AMAZON_CREATORS_US_CLIENT_ID: ${{ secrets.AMAZON_CREATORS_US_CLIENT_ID }}
          AMAZON_CREATORS_US_CLIENT_SECRET: ${{ secrets.AMAZON_CREATORS_US_CLIENT_SECRET }}
          AMAZON_CREATORS_US_VERSION: ${{ secrets.AMAZON_CREATORS_US_VERSION }}
        run: npx tsx scripts/amazon-asins.ts
      # The Compare Empire network (scripts/family-sync.ts): this site's best deals and pre-orders for
      # its sisters, and their feeds for this site's "Also in this cluster" blocks. Never fatal.
      - name: Family feed
        continue-on-error: true
        run: npx tsx scripts/family-sync.ts
      # The home pages' ranking input (src/lib/home-rank.ts, DECISIONS.md 2026-11-18): product page views and buy clicks per
      # item, last 28 and 7 days, from RiftCompare's /api/demand/ygo, written into the data commit below.
      #  Never fatal: a failed fetch keeps yesterday's file and the home page keeps its order.
      - name: Home page demand
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: DEMAND_WRITE_ONLY=1 bash scripts/pull-demand.sh ygo data/demand.json
      # Pages Search Console shows people finding (gsc-pages.json on the demand branch): they keep asking to be indexed
      # (lib/search-demand.ts, 2026-11-19). Never fatal: a failed fetch keeps yesterday's file.
      - name: Search demand
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: |
          git fetch --quiet --depth=1 origin demand
          git show FETCH_HEAD:gsc-pages.json > data/public/search-demand.json.tmp && mv data/public/search-demand.json.tmp data/public/search-demand.json
      - name: Commit data (this commit is the daily release)
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "No data changes."
            exit 0
          fi
          git commit -m "data: daily prices $(date -u +%F) [deploy]" -m "Written by refresh-prices.yml (twice a day). The build gate allows one production build per 12 hours."
          for i in 1 2 3 4; do
            git push origin HEAD:main && exit 0
            sleep $((2 ** i)); git pull --rebase origin main
          done
          exit 1
      - name: IndexNow
        if: success()
        env:
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
          NEXT_PUBLIC_SITE_URL: ${{ vars.SITE_URL }}
        run: npx tsx scripts/indexnow-submit.ts || true
