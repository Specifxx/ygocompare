    runs-on: ubuntu-latest
    steps:
      - run: |
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0 Safari/537.36"
          for id in 606221 606222 606223 606224 606225 606226 606227 606228 606229 606230 606231 606232 606233 606234 606235 606236 606237 606238 606239 606240 512344 626997 102437 538501 22699 22527 77640 26723 165463 593147 476265 702423 26265 24252 719891 476644 93890 141268 562265 59085 695580 710120 704996 714767 26613 23658 58681 702446 56922 23879 22610 129805 81006 136848 56720 279483 78051 708852 227868 579650 211605 68100 532221 66714 22543 656556 205496 66918 77783 22191 162275 22920 686896 80467 121263 25717 164636 228065 29024 206913 592812 24002 22943 550993 246279 22906 33590 22730 702465 77389 674750 60150 181271 230367 232923 606251 209926 713316 188974 194714; do
            echo "$id $(curl -s -o /dev/null -w '%{http_code}' -A "$UA" -e https://ygocompare.com/ https://tcgplayer-cdn.tcgplayer.com/product/${id}_400w.jpg) $(curl -s -o /dev/null -w '%{http_code}' -A "$UA" https://tcgplayer-cdn.tcgplayer.com/product/${id}_200w.jpg)"
