name: TEMP store trial

# Temporary (2026-10-28, store audit): runs every store the sister sites track
# that this site doesn't (and the registered stores that read nothing) through
# the real matcher (research/trial-stores.ts), one runner per market, and
# commits the results to this branch for review. Removed before merge.

on:
  push:
    branches: [claude/project-thread-y2202w]
    paths: [probe-in/**, research/trial-stores.ts, .github/workflows/probe-stores-tmp.yml]

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        market: [UAU, UCA, UEU, USG, UUK, UUS]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx tsx research/trial-stores.ts --game ygo --in probe-in/${{ matrix.market }}.json --out probe-out/${{ matrix.market }}.json > /dev/null
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: probe-${{ matrix.market }}
          path: probe-out/${{ matrix.market }}.json
          if-no-files-found: ignore

  commit:
    needs: probe
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: probe-out
          pattern: probe-*
          merge-multiple: true
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add probe-out
          git commit -m "TEMP store trial results (run ${GITHUB_RUN_ID})"
          for i in 1 2 3; do git pull --rebase -q origin "$GITHUB_REF_NAME" && git push origin "HEAD:$GITHUB_REF_NAME" && exit 0; sleep 5; done
          exit 1
